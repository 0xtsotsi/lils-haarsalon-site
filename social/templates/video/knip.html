<!DOCTYPE html>
<html lang="nl" data-format="story">
<head>
<meta charset="utf-8">
<title>De knip</title>
<link rel="stylesheet" href="../base.css">
<style>
  .stage { position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  .stage__hairline {
    position: absolute;
    left: 14%;
    right: 14%;
    top: 38%;
    height: 3px;
    background: var(--accent);
    opacity: 0.5;
  }
  .stage__gap {
    position: absolute;
    top: 38%;
    width: 30px;
    height: 32px;
    transform: translate(-50%, -50%);
    background: var(--bg);
  }
  .stage__tool {
    position: absolute;
    top: 38%;
    width: 132px;
    height: 132px;
    transform: translate(-50%, -50%);
    overflow: visible;
  }
  .stage__arm { transform-box: view-box; transform-origin: 24px 24px; }
  .stage__ring { fill: none; stroke: var(--brass-700); stroke-width: 1.5; }
  .stage__blade { fill: none; stroke: var(--brass-700); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .stage__pivot { fill: var(--brass-700); }
  .stage__curl { fill: none; stroke: var(--brass-700); stroke-width: 1.4; stroke-linecap: round; }

  .stage__brand {
    position: absolute;
    left: 0; right: 0;
    top: 56%;
    text-align: center;
    opacity: 0;
  }
  .stage__brand svg { width: 78px; height: 78px; display: block; margin: 0 auto 1.5rem; }
  .stage__name {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 120, "SOFT" 20, "WONK" 1;
    font-weight: 500;
    font-size: 4rem;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .stage__place {
    margin: 0.7rem 0 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .stage__address {
    margin: 1.8rem 0 0;
    font-size: 1.05rem;
    color: var(--ink-700);
  }
  .stage__rule {
    width: 4rem; height: 3px; background: var(--brass);
    margin: 1.4rem auto 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage__hairline"></div>
  <div class="stage__gap"></div>
  <svg class="stage__tool" viewBox="0 0 48 48">
    <g class="stage__arm stage__arm--x">
      <ellipse class="stage__ring" cx="10" cy="13" rx="3.1" ry="4.2" transform="rotate(38 10 13)"></ellipse>
      <path class="stage__blade" d="M13.2 15.8 24 24 38 31.5"></path>
    </g>
    <g class="stage__arm stage__arm--y">
      <ellipse class="stage__ring" cx="10" cy="35" rx="3.1" ry="4.2" transform="rotate(-38 10 35)"></ellipse>
      <path class="stage__blade" d="M13.2 32.2 24 24 38 16.5"></path>
    </g>
    <circle class="stage__pivot" cx="24" cy="24" r="1.5"></circle>
    <path class="stage__curl" d="M24 25.6c3.2 1.8 1 3.8 2.8 5.4"></path>
  </svg>

  <div class="stage__brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="12" fill="#18251f"/>
      <circle cx="20" cy="11" r="3.6" fill="#ea3c3f"/>
      <circle cx="20" cy="20" r="3.6" fill="#f5aa00"/>
      <circle cx="20" cy="29" r="3.6" fill="#20c45f"/>
    </svg>
    <p class="stage__name">Lil's haarsalon</p>
    <p class="stage__place">Rozenburg</p>
    <div class="stage__rule"></div>
    <p class="stage__address">Molenweg 49 &#183; 0181-219017</p>
  </div>
</div>

<script>
/* De scene wordt door de renderer per frame gezet, zodat de beweging
   exact hetzelfde is bij elke render. */
window.setTime = function (t) {
  var stage = document.querySelector(".stage");
  var tool = document.querySelector(".stage__tool");
  var gap = document.querySelector(".stage__gap");
  var brand = document.querySelector(".stage__brand");
  var armX = document.querySelector(".stage__arm--x");
  var armY = document.querySelector(".stage__arm--y");
  var curl = document.querySelector(".stage__curl");

  /* De schaar rijdt van links naar rechts tussen 0.4 en 5.0 seconde. */
  var travelStart = 0.4;
  var travelEnd = 5.0;
  var p = Math.min(Math.max((t - travelStart) / (travelEnd - travelStart), 0), 1);
  var x = 14 + p * 72;
  tool.style.left = x + "%";
  gap.style.left = x + "%";

  /* Om de 1.15 seconden gaat de schaar dicht. */
  var snips = [1.55, 2.70, 3.85];
  var close = 0;
  var sinceSnip = 99;
  for (var i = 0; i < snips.length; i += 1) {
    var d = t - snips[i];
    if (d >= -0.09 && d < 0.18) {
      var k = (d + 0.09) / 0.27;
      close = Math.max(close, 1 - Math.abs(k - 0.5) * 2);
    }
    if (d >= 0 && d < sinceSnip) sinceSnip = d;
  }
  var open = 4;
  armX.style.transform = "rotate(" + (-open + close * 15) + "deg)";
  armY.style.transform = "rotate(" + (open - close * 15) + "deg)";

  /* Het afgeknipte lokje valt na de knip naar beneden. */
  if (sinceSnip < 0.9) {
    var f = sinceSnip / 0.9;
    curl.style.opacity = String(f < 0.15 ? f / 0.15 : Math.max(0, 1 - (f - 0.15) / 0.85) * 0.9);
    curl.style.transform = "translateY(" + (f * 13) + "px) rotate(" + (f * 18) + "deg)";
  } else {
    curl.style.opacity = "0";
  }

  /* Het merk komt tevoorschijn als de schaar klaar is. */
  var appear = Math.min(Math.max((t - 4.9) / 0.8, 0), 1);
  brand.style.opacity = String(appear);
  brand.style.transform = "translateY(" + (1 - appear) * 14 + "px)";

  /* Aan het einde vervaagt alles zachtjes. */
  var out = t > 5.8 ? (t - 5.8) / 0.4 : 0;
  stage.style.opacity = String(1 - out * 0.9);
};
</script>
</body>
</html>
