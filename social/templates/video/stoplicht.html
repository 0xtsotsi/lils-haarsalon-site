<!DOCTYPE html>
<html lang="nl" data-format="story">
<head>
<meta charset="utf-8">
<title>Het stoplicht</title>
<link rel="stylesheet" href="../base.css">
<style>
  .stage { position: relative; width: 100%; height: 100%; background: var(--ink); overflow: hidden; }
  .stage__brand {
    position: absolute; top: 8%; left: 8%;
    display: flex; align-items: center; gap: 0.7rem; opacity: 0;
  }
  .stage__brand svg { width: 46px; height: 46px; flex: 0 0 auto; }
  .stage__brandtext { display: flex; flex-direction: column; line-height: 1; }
  .stage__brandname {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 20, "WONK" 1;
    font-weight: 600; font-size: 1.3rem; color: var(--bg);
  }
  .stage__brandplace {
    margin-top: 0.26rem; font-size: 0.58rem; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-on-ink);
  }
  .stage__light {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    width: 168px; height: 440px;
    background: #111a15;
    border-radius: 84px;
    box-shadow: inset 0 0 0 5px #25342d;
  }
  .stage__bulb {
    position: absolute; left: 50%; width: 108px; height: 108px;
    border-radius: 50%; transform: translateX(-50%);
  }
  .stage__bulb--red { top: 34px; background: #3a1512; }
  .stage__bulb--amber { top: 166px; background: #3a2708; }
  .stage__bulb--green { top: 298px; background: #0d3318; }
  .stage__caption {
    position: absolute; left: 8%; right: 8%; bottom: 13%;
    text-align: center; color: var(--bg); opacity: 0;
  }
  .stage__caption-text {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 72, "SOFT" 20, "WONK" 1;
    font-weight: 500; font-size: 2.6rem; line-height: 1.1;
    letter-spacing: -0.015em; margin: 0;
  }
  .stage__caption-sub {
    margin: 0.9rem 0 0; font-size: 0.95rem; color: rgba(249,247,241,0.82);
  }
  .stage__foot {
    position: absolute; left: 8%; bottom: 6%;
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.76rem; font-weight: 500; letter-spacing: 0.06em;
    color: rgba(249,247,241,0.8); opacity: 0;
  }
  .stage__foot span:last-child { color: var(--brass-on-ink); font-weight: 700; }
  .stage__dot { width: 0.24rem; height: 0.24rem; border-radius: 50%; background: var(--brass-on-ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="stage__brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="12" fill="#f0ece3"/>
      <circle cx="20" cy="11" r="3.6" fill="#c52b30"/>
      <circle cx="20" cy="20" r="3.6" fill="#bd6800"/>
      <circle cx="20" cy="29" r="3.6" fill="#008f35"/>
    </svg>
    <span class="stage__brandtext">
      <span class="stage__brandname">Lil's haarsalon</span>
      <span class="stage__brandplace">Rozenburg</span>
    </span>
  </div>

  <div class="stage__light">
    <span class="stage__bulb stage__bulb--red"></span>
    <span class="stage__bulb stage__bulb--amber"></span>
    <span class="stage__bulb stage__bulb--green"></span>
  </div>

  <div class="stage__caption">
    <p class="stage__caption-text">Het stoplicht aan de deur</p>
    <p class="stage__caption-sub">Rood is helaas, oranje is misschien, groen betekent dat je vast geholpen kunt worden.</p>
  </div>

  <div class="stage__foot">
    <span>Molenweg 49, Rozenburg</span>
    <span class="stage__dot"></span>
    <span>0181-219017</span>
  </div>
</div>

<script>
/* De drie lampen gaan om de beurt aan, van rood naar groen. */
window.setTime = function (t) {
  var brand = document.querySelector(".stage__brand");
  var caption = document.querySelector(".stage__caption");
  var foot = document.querySelector(".stage__foot");
  var red = document.querySelector(".stage__bulb--red");
  var amber = document.querySelector(".stage__bulb--amber");
  var green = document.querySelector(".stage__bulb--green");

  var appear = Math.min(Math.max(t / 0.7, 0), 1);
  brand.style.opacity = String(appear);

  /* Rood brandt van 0.9 tot 2.1, oranje van 2.1 tot 3.3, groen daarna. */
  function lit(lamp, color, from, to) {
    var on = t >= from && t < to ? 1 : 0;
    lamp.style.background = on ? color : "rgba(0,0,0,0)";
    lamp.style.boxShadow = on ? "0 0 46px " + color : "none";
  }
  lit(red, "#ea3c3f", 0.9, 2.1);
  lit(amber, "#f5aa00", 2.1, 3.3);
  lit(green, "#20c45f", 3.3, 99);

  /* De lamp waar je nu bent, ademt een beetje. */
  var pulse = 1 + Math.sin(t * 2.4) * 0.04;
  var active = t < 2.1 ? red : t < 3.3 ? amber : green;
  active.style.transform = "translateX(-50%) scale(" + pulse + ")";

  var textIn = Math.min(Math.max((t - 3.5) / 0.9, 0), 1);
  caption.style.opacity = String(textIn);
  caption.style.transform = "translateY(" + (1 - textIn) * 14 + "px)";

  var footIn = Math.min(Math.max((t - 4.3) / 0.8, 0), 1);
  foot.style.opacity = String(footIn);

  var out = t > 5.9 ? (t - 5.9) / 0.5 : 0;
  document.querySelector(".stage").style.opacity = String(1 - out * 0.9);
};
</script>
</body>
</html>
