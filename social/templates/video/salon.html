<!DOCTYPE html>
<html lang="nl" data-format="story">
<head>
<meta charset="utf-8">
<title>De salon</title>
<link rel="stylesheet" href="../base.css">
<style>
  .stage { position: relative; width: 100%; height: 100%; background: var(--ink); overflow: hidden; }
  .stage__photo { position: absolute; inset: 0; overflow: hidden; }
  .stage__photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .stage__veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(24,37,31,0.5) 0%, rgba(24,37,31,0.1) 34%,
      rgba(24,37,31,0.55) 72%, rgba(24,37,31,0.95) 100%);
  }
  .stage__brand {
    position: absolute; top: 7%; left: 8%;
    display: flex; align-items: center; gap: 0.7rem;
    opacity: 0;
  }
  .stage__brand svg { width: 46px; height: 46px; flex: 0 0 auto; }
  .stage__brandtext { display: flex; flex-direction: column; line-height: 1; }
  .stage__brandname {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 36, "SOFT" 20, "WONK" 1;
    font-weight: 600; font-size: 1.3rem; color: var(--bg);
  }
  .stage__brandplace {
    margin-top: 0.26rem; font-size: 0.58rem; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: rgba(249,247,241,0.85);
  }
  .stage__text { position: absolute; left: 8%; right: 8%; bottom: 14%; color: var(--bg); opacity: 0; }
  .stage__eyebrow {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--brass-on-ink); margin: 0 0 0.8rem;
  }
  .stage__title {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 120, "SOFT" 20, "WONK" 1;
    font-weight: 500; font-size: 3.6rem; line-height: 1.05;
    letter-spacing: -0.02em; margin: 0; max-width: 15ch;
  }
  .stage__sub { margin: 1.1rem 0 0; font-size: 1rem; color: rgba(249,247,241,0.88); max-width: 30ch; }
  .stage__foot {
    position: absolute; left: 8%; bottom: 6%;
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.76rem; font-weight: 500; letter-spacing: 0.06em;
    color: rgba(249,247,241,0.8); opacity: 0;
  }
  .stage__foot span:last-child { color: var(--brass-on-ink); font-weight: 700; }
  .stage__dot { width: 0.24rem; height: 0.24rem; border-radius: 50%; background: var(--brass-on-ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="stage__photo">
    <img src="../../images/salon-interior-wide.jpg" alt="">
  </div>
  <div class="stage__veil"></div>

  <div class="stage__brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="12" fill="#f0ece3"/>
      <circle cx="20" cy="11" r="3.6" fill="#c52b30"/>
      <circle cx="20" cy="20" r="3.6" fill="#bd6800"/>
      <circle cx="20" cy="29" r="3.6" fill="#008f35"/>
    </svg>
    <span class="stage__brandtext">
      <span class="stage__brandname">Lil's haarsalon</span>
      <span class="stage__brandplace">Rozenburg</span>
    </span>
  </div>

  <div class="stage__text">
    <p class="stage__eyebrow">De salon</p>
    <h1 class="stage__title">Licht, rustig en netjes</h1>
    <p class="stage__sub">Geen drukte, alleen aandacht voor jouw haar.</p>
  </div>

  <div class="stage__foot">
    <span>Molenweg 49, Rozenburg</span>
    <span class="stage__dot"></span>
    <span>0181-219017</span>
  </div>
</div>

<script>
/* De foto zakt langzaam naar binnen, alsof de camera rustig meebeweegt. */
window.setTime = function (t) {
  var img = document.querySelector(".stage__photo img");
  var brand = document.querySelector(".stage__brand");
  var text = document.querySelector(".stage__text");
  var foot = document.querySelector(".stage__foot");

  var zoom = 1.04 + (t / 6.5) * 0.06;
  img.style.transform = "scale(" + zoom + ")";

  var appear = Math.min(Math.max((t - 0.7) / 0.9, 0), 1);
  brand.style.opacity = String(appear);
  brand.style.transform = "translateY(" + (1 - appear) * -10 + "px)";

  var textIn = Math.min(Math.max((t - 1.5) / 1.0, 0), 1);
  text.style.opacity = String(textIn);
  text.style.transform = "translateY(" + (1 - textIn) * 16 + "px)";

  var footIn = Math.min(Math.max((t - 2.3) / 0.9, 0), 1);
  foot.style.opacity = String(footIn);

  var out = t > 5.9 ? (t - 5.9) / 0.5 : 0;
  document.querySelector(".stage").style.opacity = String(1 - out * 0.9);
};
</script>
</body>
</html>
