<!DOCTYPE html>
<html lang="nl" data-format="square">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="base.css">
<style>
  .post { padding: 0; }
  .post__band {
    position: relative;
    flex: 0 0 auto;
    height: 34%;
    overflow: hidden;
  }
  .post__band img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: {{FOCAL}};
    display: block;
  }
  .post__band::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(24,37,31,0.3) 0%, rgba(24,37,31,0) 50%);
  }
  .post__panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    padding: 1.8rem 2.4rem 2.2rem;
    background: var(--bg);
  }
  .post__body { margin-top: 1.3rem; }
  .post__body .display { font-size: 2.9rem; max-width: 18ch; }
  .post__card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border-radius: 1.3rem;
    padding: 1.5rem 1.7rem;
    margin-top: 1.5rem;
  }
  .post__card-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem; }
  .post__card-rule { flex: 1 1 auto; height: 1px; background: var(--line); }
  .post__tip-list { list-style: none; margin: 0; padding: 0; }
  .post__tip-list li {
    display: flex;
    gap: 0.7rem;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--ink-700);
    padding: 0.36rem 0;
  }
  .post__tip-list li::before {
    content: "";
    flex: 0 0 auto;
    width: 0.4rem;
    height: 0.4rem;
    border-radius: 50%;
    background: var(--brass);
    margin-top: 0.55rem;
  }
  .post__foot { margin-top: auto; padding-top: 1.3rem; }

  html[data-format="portrait"] .post__band { height: 32%; }
  html[data-format="portrait"] .post__body .display { font-size: 3.3rem; }
  html[data-format="portrait"] .post__panel { padding: 2rem 2.8rem 2.4rem; }
  html[data-format="portrait"] .post__tip-list li { font-size: 0.96rem; }

  html[data-format="story"] .post__band { height: 40%; }
  html[data-format="story"] .post__panel { padding: 1.8rem 3.2rem 20rem; justify-content: center; }
  html[data-format="story"] .post__body { margin-top: 1rem; }
  html[data-format="story"] .post__body .display { font-size: 3rem; }
  html[data-format="story"] .post__card { padding: 1.3rem 1.5rem; margin-top: 1rem; }
  html[data-format="story"] .post__tip-list li { font-size: 0.88rem; padding: 0.24rem 0; }
  html[data-format="story"] .post__body .display { font-size: 3.8rem; }
  html[data-format="story"] .post__tip-list li { font-size: 1rem; }

  /* Landschap is 628 px hoog, dus alles moet kleiner en compacter. */
  html[data-format="landscape"] .post { flex-direction: row; }
  html[data-format="landscape"] .post__band { height: 100%; width: 36%; }
  html[data-format="landscape"] .post__panel { padding: 1.1rem 1.6rem; justify-content: center; }
  html[data-format="landscape"] .post__body { margin-top: 0.5rem; }
  html[data-format="landscape"] .post__body .display { font-size: 1.6rem; max-width: 22ch; }
  html[data-format="landscape"] .post__eyebrow { margin-bottom: 0.4rem; }
  html[data-format="landscape"] .post__card { padding: 0.7rem 0.9rem; margin-top: 0.7rem; border-radius: 0.8rem; }
  html[data-format="landscape"] .post__card-head { margin-bottom: 0.3rem; }
  html[data-format="landscape"] .post__tip-list li { font-size: 0.78rem; padding: 0.24rem 0; line-height: 1.35; }
  html[data-format="landscape"] .post__tip-list li::before { margin-top: 0.44rem; }
  html[data-format="landscape"] .post__foot { margin-top: 1rem; padding-top: 0; font-size: 0.62rem; }
  html[data-format="landscape"] .mark__name { font-size: 1rem; }
  html[data-format="landscape"] .mark__place { margin-top: 0.2rem; font-size: 0.5rem; }
  html[data-format="landscape"] .mark__lamp { width: 1.7rem; height: 1.7rem; }
</style>
</head>
<body>
<div class="post">
  <div class="post__band"><img src="../images/{{IMG}}" alt=""></div>

  <div class="post__panel">
    <div class="mark">
      <span class="mark__lamp">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="#18251f"/>
          <circle cx="20" cy="11" r="3.6" fill="#ea3c3f"/>
          <circle cx="20" cy="20" r="3.6" fill="#f5aa00"/>
          <circle cx="20" cy="29" r="3.6" fill="#20c45f"/>
        </svg>
      </span>
      <span class="mark__text">
        <span class="mark__name">Lil's haarsalon</span>
        <span class="mark__place">Rozenburg</span>
      </span>
    </div>

    <div class="post__body stack">
      <p class="eyebrow post__eyebrow">{{EYEBROW}}</p>
      <h1 class="display">{{TITLE}}</h1>

      <div class="post__card">
        <div class="post__card-head">
          <span class="eyebrow" style="margin:0">{{CARDLABEL}}</span>
          <span class="post__card-rule"></span>
        </div>
        <ul class="post__tip-list">
          {{TIPS}}
        </ul>
      </div>
    </div>

    <div class="post__foot">
      <span>Molenweg 49, Rozenburg</span>
      <span class="post__foot-dot"></span>
      <span class="post__foot-handle">0181-219017</span>
    </div>
  </div>
</div>
</body>
</html>
