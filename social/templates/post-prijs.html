<!DOCTYPE html>
<html lang="nl" data-format="square">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="base.css">
<style>
  .post { padding: 0; }
  .post__band {
    position: relative;
    flex: 0 0 auto;
    height: 42%;
    overflow: hidden;
  }
  .post__band img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: {{FOCAL}};
    display: block;
  }
  .post__band::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(24,37,31,0.32) 0%, rgba(24,37,31,0) 46%);
  }
  .post__panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    padding: 1.9rem 2.4rem 2.2rem;
    background: var(--bg);
  }
  .post__head { display: flex; justify-content: space-between; align-items: flex-start; }
  .post__body { margin-top: 1.5rem; }
  .post__body .display { font-size: 2.9rem; max-width: 18ch; }
  .post__body .lede { font-size: 0.95rem; margin-top: 0.8rem; max-width: 38ch; }
  .post__price {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin: 1.3rem 0 0;
    padding-top: 1.1rem;
    border-top: 2px solid var(--line);
  }
  .post__spacer { flex: 1 1 auto; min-height: 0.6rem; }
  .post__price-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-500);
  }
  .post__price-value {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 120, "SOFT" 20, "WONK" 1;
    font-weight: 600;
    font-size: 2.7rem;
    color: var(--accent-700);
    line-height: 1;
  }
  .post__note { font-size: 0.7rem; color: var(--ink-500); margin: 1.1rem 0 0; line-height: 1.45; }
  .post__foot { margin-top: auto; padding-top: 1.2rem; }

  html[data-format="portrait"] .post__band { height: 40%; }
  html[data-format="portrait"] .post__body .display { font-size: 3.3rem; }
  html[data-format="portrait"] .post__price-value { font-size: 3.1rem; }
  html[data-format="portrait"] .post__panel { padding: 2.1rem 2.8rem 2.4rem; }

  html[data-format="story"] .post__band { height: 42%; }
  html[data-format="story"] .post__panel { padding: 1.8rem 3.2rem 20rem; justify-content: center; }
  html[data-format="story"] .post__body { margin-top: 1rem; }
  html[data-format="story"] .post__body .display { font-size: 3.1rem; }
  html[data-format="story"] .post__body .lede { font-size: 0.92rem; margin-top: 0.6rem; }
  html[data-format="story"] .post__price { margin-top: 0.9rem; padding-top: 0.9rem; }
  html[data-format="story"] .post__price-value { font-size: 2.9rem; }
  html[data-format="story"] .post__note { margin-top: 0.8rem; }
  html[data-format="story"] .post__tip-list li { font-size: 0.94rem; padding: 0.3rem 0; }
  html[data-format="story"] .post__body .display { font-size: 3.8rem; }
  html[data-format="story"] .post__price-value { font-size: 3.6rem; }

  /* Landschap is 628 px hoog, dus alles moet kleiner en compacter. */
  html[data-format="landscape"] .post { flex-direction: row; }
  html[data-format="landscape"] .post__band { height: 100%; width: 40%; }
  html[data-format="landscape"] .post__panel { padding: 1.1rem 1.6rem; justify-content: center; }
  html[data-format="landscape"] .post__body { margin-top: 0.5rem; }
  html[data-format="landscape"] .post__body .display { font-size: 1.7rem; max-width: 20ch; }
  html[data-format="landscape"] .post__eyebrow { margin-bottom: 0.4rem; }
  html[data-format="landscape"] .post__body .lede { font-size: 0.76rem; margin-top: 0.5rem; max-width: 40ch; }
  html[data-format="landscape"] .post__price { margin-top: 0.7rem; padding-top: 0.7rem; }
  html[data-format="landscape"] .post__price-value { font-size: 1.8rem; }
  html[data-format="landscape"] .post__price-label { font-size: 0.6rem; }
  html[data-format="landscape"] .post__note { display: none; }
  html[data-format="landscape"] .post__foot { margin-top: 1rem; padding-top: 0; font-size: 0.62rem; }
  html[data-format="landscape"] .mark__name { font-size: 1rem; }
  html[data-format="landscape"] .mark__place { margin-top: 0.2rem; font-size: 0.5rem; }
  html[data-format="landscape"] .mark__lamp { width: 1.7rem; height: 1.7rem; }
</style>
</head>
<body>
<div class="post">
  <div class="post__band"><img src="../images/{{IMG}}" alt=""></div>

  <div class="post__panel">
    <div class="post__head">
      <div class="mark">
        <span class="mark__lamp">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="12" fill="#18251f"/>
            <circle cx="20" cy="11" r="3.6" fill="#ea3c3f"/>
            <circle cx="20" cy="20" r="3.6" fill="#f5aa00"/>
            <circle cx="20" cy="29" r="3.6" fill="#20c45f"/>
          </svg>
        </span>
        <span class="mark__text">
          <span class="mark__name">Lil's haarsalon</span>
          <span class="mark__place">Rozenburg</span>
        </span>
      </div>
    </div>

    <div class="post__body stack">
      <p class="eyebrow post__eyebrow">{{EYEBROW}}</p>
      <h1 class="display">{{TITLE}}</h1>
      <p class="lede">{{BODY}}</p>
      <div class="post__price">
        <span class="post__price-label">Vanaf</span>
        <span class="post__price-value">{{PRICE}}</span>
      </div>
      <p class="post__note">Prijs per behandeling, afhankelijk van haarlengte en dikte. Bel voor de actuele prijs.</p>
      <div class="post__spacer"></div>
    </div>

    <div class="post__foot">
      <span>Molenweg 49, Rozenburg</span>
      <span class="post__foot-dot"></span>
      <span class="post__foot-handle">0181-219017</span>
    </div>
  </div>
</div>
</body>
</html>
