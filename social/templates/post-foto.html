<!DOCTYPE html>
<html lang="nl" data-format="square">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="base.css">
<style>
  .post { padding: 0; }
  .post__band {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    min-height: 0;
  }
  .post__band img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: {{FOCAL}};
    display: block;
  }
  .post__panel {
    flex: 0 0 auto;
    background: var(--ink);
    color: var(--bg);
    padding: 1.9rem 2.4rem 2rem;
  }
  .post__mark .mark__lamp { width: 2.6rem; height: 2.6rem; }
  .post__mark .mark__name { color: var(--bg); }
  .post__mark .mark__place { color: var(--brass-on-ink); }
  .post--ink .mark__place { color: var(--brass-on-ink); }
  .post__body .eyebrow { color: var(--brass-on-ink); margin-bottom: 0.7rem; }
  .post__body .display { font-size: 2.9rem; max-width: 18ch; }
  .post__body .lede { color: rgba(249,247,241,0.86); max-width: 36ch; font-size: 0.95rem; margin-top: 0.8rem; }
  .post__body .rule { background: var(--brass); }
  .post__foot {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1.2rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line-dark);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(249,247,241,0.8);
  }
  .post__foot .post__foot-dot { background: var(--brass-on-ink); }
  .post__foot .post__foot-handle { color: var(--brass-on-ink); font-weight: 700; }

  html[data-format="portrait"] .post__panel { padding: 2.1rem 2.8rem 2.2rem; }
  html[data-format="portrait"] .post__body .display { font-size: 3.3rem; }
  html[data-format="portrait"] .post__body .lede { font-size: 1rem; }

  html[data-format="story"] .post__panel { padding: 2.1rem 3.2rem 22rem; }
  html[data-format="story"] .post__body .display { font-size: 3.8rem; }
  html[data-format="story"] .post__body .lede { font-size: 1.05rem; }

  html[data-format="landscape"] .post { flex-direction: row; }
  html[data-format="landscape"] .post__band { width: 46%; }
  html[data-format="landscape"] .post__panel { width: 54%; display: flex; flex-direction: column; justify-content: center; padding: 1.8rem 2.2rem; }
  html[data-format="landscape"] .post__body .display { font-size: 2.2rem; }
  html[data-format="landscape"] .post__body .lede { font-size: 0.84rem; margin-top: 0.6rem; }
  html[data-format="landscape"] .post__foot { margin-top: 1.1rem; padding-top: 0.8rem; }
</style>
</head>
<body>
<div class="post">
  <div class="post__band">
    <img src="../images/{{IMG}}" alt="">
  </div>

  <div class="post__panel post--ink">
    <div class="mark">
      <span class="mark__lamp">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="#f0ece3"/>
          <circle cx="20" cy="11" r="3.6" fill="#c52b30"/>
          <circle cx="20" cy="20" r="3.6" fill="#bd6800"/>
          <circle cx="20" cy="29" r="3.6" fill="#008f35"/>
        </svg>
      </span>
      <span class="mark__text">
        <span class="mark__name">Lil's haarsalon</span>
        <span class="mark__place">Rozenburg</span>
      </span>
    </div>
    <div class="post__body stack">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1 class="display">{{TITLE}}</h1>
      <p class="lede">{{BODY}}</p>
      <hr class="rule">
    </div>

    <div class="post__foot">
      <span>Molenweg 49, Rozenburg</span>
      <span class="post__foot-dot"></span>
      <span class="post__foot-handle">0181-219017</span>
    </div>
  </div>
</div>
</body>
</html>
